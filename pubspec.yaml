name: swimtracker
description: Track your open water swimming sessions.
publish_to: none
version: 1.0.2+60

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_native_splash: ^2.4.0
  riverpod_annotation: ^4.0.2
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  health: ^13.3.1
  dio: ^5.4.3
  geolocator: ^14.0.2
  flutter_local_notifications: ^18.0.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.3
  intl: ^0.20.2
  equatable: ^2.0.5
  shared_preferences: ^2.3.1
  geocoding: ^3.0.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^4.0.3

flutter_native_splash:
  color: "#0D2137"        # bleu océan foncé comme le fond du logo
  image: assets/logo.png  # ton icône 1024x1024
  color_dark: "#0D2137"
  image_dark: assets/logo.png
  android_12:
    color: "#0D2137"
    image: assets/logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
